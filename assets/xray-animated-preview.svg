<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" style="background:#060b13; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;">
  <defs>
    <!-- Radiographic Grid Gradient -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanMotion {
      0% { transform: translateY(60px); opacity: 0.2; }
      15% { opacity: 0.95; }
      85% { opacity: 0.95; }
      100% { transform: translateY(380px); opacity: 0.2; }
    }
    @keyframes pulseRing {
      0% { r: 6px; opacity: 1; stroke-width: 2px; }
      50% { opacity: 0.6; }
      100% { r: 36px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes skullBreathe {
      0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7)); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes telemetryGlitch {
      0%, 92%, 100% { opacity: 0.9; }
      93% { opacity: 0.4; }
      95% { opacity: 0.95; }
    }

    .scan-beam-group {
      animation: scanMotion 4.5s ease-in-out infinite alternate;
    }
    .pulse-emitter {
      animation: pulseRing 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .skull-wireframe {
      animation: skullBreathe 6s ease-in-out infinite;
    }
    .status-dot {
      animation: blinkDot 1.4s ease-in-out infinite;
    }
    .hud-text {
      animation: telemetryGlitch 5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Slate Canvas Backdrop with Grid -->
  <rect width="100%" height="100%" fill="#060b13"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Top Technical Header -->
  <g transform="translate(36, 34)">
    <circle cx="6" cy="6" r="4" fill="#0284c7" class="status-dot"/>
    <text x="18" y="10" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">LIVE RADIOGRAPHIC SCANNER &#183; THREE.JS WEBGL GLSL</text>
    <text x="18" y="28" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">HUMAN ANATOMY 3D &#183; DENTAL &amp; CRANIAL ATLAS</text>
  </g>

  <!-- Right Side Status Matrix -->
  <g transform="translate(640, 36)" text-anchor="start" font-size="10" fill="#64748b" class="hud-text">
    <text x="0" y="0">MODE: <tspan fill="#38bdf8" font-weight="700">VOLUMETRIC X-RAY</tspan></text>
    <text x="0" y="16">FMA CODED ENTITIES: <tspan fill="#f8fafc" font-weight="600">49 RIGID PARTS</tspan></text>
    <text x="0" y="32">TMJ ARTICULATION: <tspan fill="#38bdf8" font-weight="600">DYNAMIC CONDYLAR</tspan></text>
    <text x="0" y="48">DENTAL OCCLUSION: <tspan fill="#38bdf8" font-weight="600">CLASS I (NEUTRO)</tspan></text>
  </g>

  <!-- Corner Alignment Reticles -->
  <g stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" fill="none">
    <path d="M 24 64 L 24 44 L 44 44"/>
    <path d="M 856 64 L 856 44 L 836 44"/>
    <path d="M 24 416 L 24 436 L 44 436"/>
    <path d="M 856 416 L 856 436 L 836 436"/>
  </g>

  <!-- Left Anatomy Overview and Occlusion Callouts -->
  <g transform="translate(48, 140)" font-size="11">
    <!-- Callout 1 -->
    <circle cx="160" cy="18" r="2.5" fill="#38bdf8"/>
    <line x1="160" y1="18" x2="110" y2="18" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="100" y="22" text-anchor="end" fill="#f8fafc" font-weight="600">Neurocranium</text>
    <text x="100" y="36" text-anchor="end" fill="#64748b" font-size="9">Os frontale &#183; Os parietale</text>

    <!-- Callout 2 -->
    <circle cx="168" cy="100" r="2.5" fill="#38bdf8"/>
    <line x1="168" y1="100" x2="110" y2="100" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="100" y="104" text-anchor="end" fill="#f8fafc" font-weight="600">Orbit &amp; Zygoma</text>
    <text x="100" y="118" text-anchor="end" fill="#64748b" font-size="9">Optic canal &#183; CN II / III / V1</text>

    <!-- Callout 3 -->
    <circle cx="178" cy="172" r="2.5" fill="#38bdf8"/>
    <line x1="178" y1="172" x2="110" y2="172" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="100" y="176" text-anchor="end" fill="#f8fafc" font-weight="600">Maxillary Dentition</text>
    <text x="100" y="190" text-anchor="end" fill="#38bdf8" font-size="9">Crown &#183; Alveolar Crest</text>

    <!-- Callout 4 -->
    <circle cx="170" cy="226" r="2.5" fill="#38bdf8"/>
    <line x1="170" y1="226" x2="110" y2="226" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="100" y="230" text-anchor="end" fill="#f8fafc" font-weight="600">Mandibular Canal</text>
    <text x="100" y="244" text-anchor="end" fill="#64748b" font-size="9">Mental foramen &#183; CN V3</text>
  </g>

  <!-- Central Radiographic Skull and Dental Architecture -->
  <g transform="translate(340, 60)" class="skull-wireframe">
    <!-- Focal Circular Reticle -->
    <circle cx="100" cy="180" r="140" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
    <circle cx="100" cy="180" r="100" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Cranial Vault (Calvaria) -->
    <path d="M 32 170 C 20 100, 48 30, 100 28 C 152 30, 180 100, 168 170 C 160 215, 142 245, 138 275 C 135 295, 126 312, 100 312 C 74 312, 65 295, 62 275 C 58 245, 40 215, 32 170 Z" 
          fill="none" stroke="#f8fafc" stroke-width="2.2" opacity="0.9" filter="url(#neonGlow)"/>

    <!-- Brain / Cerebrum Radiographic Convolution Curves -->
    <g fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.6">
      <path d="M 52 140 Q 72 80, 100 82 Q 130 84, 148 138"/>
      <path d="M 60 110 Q 90 60, 120 75 Q 140 90, 145 120"/>
      <path d="M 68 160 Q 95 120, 108 140 Q 125 110, 136 158"/>
      <path d="M 76 90 Q 100 50, 115 70 Q 135 60, 132 95"/>
    </g>

    <!-- Orbital Sockets -->
    <ellipse cx="68" cy="162" rx="19" ry="17" fill="rgba(6, 11, 19, 0.75)" stroke="#38bdf8" stroke-width="1.8"/>
    <ellipse cx="132" cy="162" rx="19" ry="17" fill="rgba(6, 11, 19, 0.75)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="68" cy="162" r="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="132" cy="162" r="3" fill="#38bdf8" opacity="0.8"/>

    <!-- Piriform Aperture (Nasal Cavity) -->
    <path d="M 100 178 L 93 205 Q 100 215, 107 205 Z" fill="rgba(6, 11, 19, 0.9)" stroke="#38bdf8" stroke-width="1.6"/>
    <line x1="100" y1="180" x2="100" y2="210" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Zygomatic Arches -->
    <path d="M 45 174 C 34 185, 36 210, 48 220" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 155 174 C 166 185, 164 210, 152 220" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Maxilla and Alveolar Process -->
    <path d="M 68 225 Q 100 220, 132 225 L 130 242 Q 100 245, 70 242 Z" fill="none" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Dentition: Maxillary and Mandibular Occlusal Plane -->
    <g fill="#f8fafc" stroke="#0284c7" stroke-width="0.8" opacity="0.95">
      <!-- Upper Incisors, Canines, Premolars -->
      <rect x="74" y="235" width="6" height="8" rx="1"/>
      <rect x="82" y="236" width="7" height="9" rx="1"/>
      <rect x="91" y="237" width="8" height="9.5" rx="1"/>
      <rect x="101" y="237" width="8" height="9.5" rx="1"/>
      <rect x="111" y="236" width="7" height="9" rx="1"/>
      <rect x="120" y="235" width="6" height="8" rx="1"/>

      <!-- Lower Incisors, Canines, Premolars -->
      <rect x="76" y="247" width="5.5" height="8" rx="1"/>
      <rect x="83.5" y="248" width="6.5" height="8.5" rx="1"/>
      <rect x="92" y="248.5" width="7.5" height="9" rx="1"/>
      <rect x="101.5" y="248.5" width="7.5" height="9" rx="1"/>
      <rect x="110.5" y="248" width="6.5" height="8.5" rx="1"/>
      <rect x="118.5" y="247" width="5.5" height="8" rx="1"/>
    </g>

    <!-- Occlusal Horizon Line -->
    <line x1="68" y1="246" x2="132" y2="246" stroke="#38bdf8" stroke-width="1.4" stroke-dasharray="3 1.5"/>

    <!-- Mandible (Jawbone) and Mental Protuberance -->
    <path d="M 52 216 L 56 264 Q 68 298, 100 304 Q 132 298, 144 264 L 148 216" fill="none" stroke="#f8fafc" stroke-width="2.2"/>
    <ellipse cx="100" cy="288" rx="12" ry="5" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>

    <!-- TMJ Condyle Articulation Points with Pulse Rings -->
    <g transform="translate(46, 206)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="pulse-emitter"/>
    </g>
    <g transform="translate(154, 206)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" class="pulse-emitter"/>
    </g>
  </g>

  <!-- Right Side Anatomy Callouts (Cranial and Muscular) -->
  <g transform="translate(580, 140)" font-size="11">
    <!-- Callout 5 -->
    <circle cx="-38" cy="65" r="2.5" fill="#38bdf8"/>
    <line x1="-38" y1="65" x2="15" y2="65" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="25" y="69" text-anchor="start" fill="#f8fafc" font-weight="600">Temporalis Muscle</text>
    <text x="25" y="83" text-anchor="start" fill="#64748b" font-size="9">Elevation &#183; Retraction &#183; CN V3</text>

    <!-- Callout 6 -->
    <circle cx="-36" cy="130" r="2.5" fill="#38bdf8"/>
    <line x1="-36" y1="130" x2="15" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="25" y="134" text-anchor="start" fill="#f8fafc" font-weight="600">TMJ Condylar Head</text>
    <text x="25" y="148" text-anchor="start" fill="#38bdf8" font-size="9">Glenoid fossa &#183; 0.0&#176; Articulation</text>

    <!-- Callout 7 -->
    <circle cx="-38" cy="195" r="2.5" fill="#38bdf8"/>
    <line x1="-38" y1="195" x2="15" y2="195" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="25" y="199" text-anchor="start" fill="#f8fafc" font-weight="600">Masseteric Apparatus</text>
    <text x="25" y="213" text-anchor="start" fill="#64748b" font-size="9">Max bite force &gt; 700 N</text>

    <!-- Callout 8 -->
    <circle cx="-42" cy="255" r="2.5" fill="#38bdf8"/>
    <line x1="-42" y1="255" x2="15" y2="255" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="25" y="259" text-anchor="start" fill="#f8fafc" font-weight="600">Mental Protuberance</text>
    <text x="25" y="273" text-anchor="start" fill="#64748b" font-size="9">Symphysis menti &#183; Alveolar ridge</text>
  </g>

  <!-- Animated Radiographic Laser Scanline Beam -->
  <g class="scan-beam-group">
    <rect x="240" y="0" width="400" height="42" fill="url(#scanBeam)"/>
    <line x1="220" y1="42" x2="660" y2="42" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
    <circle cx="220" cy="42" r="3" fill="#f8fafc"/>
    <circle cx="660" cy="42" r="3" fill="#f8fafc"/>
  </g>

  <!-- Bottom Interactive HUD Telemetry Bar -->
  <g transform="translate(36, 420)">
    <rect width="808" height="26" rx="6" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="16" y="17" fill="#94a3b8" font-size="10" font-weight="500">CROSS-SECTION CUT: <tspan fill="#f8fafc">OFF</tspan></text>
    <text x="180" y="17" fill="#94a3b8" font-size="10" font-weight="500">EXPOSURE: <tspan fill="#38bdf8">1.00</tspan></text>
    <text x="310" y="17" fill="#94a3b8" font-size="10" font-weight="500">EXPLODE OFFSET: <tspan fill="#f8fafc">0%</tspan></text>
    <text x="460" y="17" fill="#94a3b8" font-size="10" font-weight="500">SHADER: <tspan fill="#38bdf8">DEPTH-INDEPENDENT FRESNEL</tspan></text>
    <text x="792" y="17" text-anchor="end" fill="#38bdf8" font-size="10" font-weight="700">60 FPS VERIFIED</text>
  </g>
</svg>
