<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Cranial Calvaria (Skull Outline) -->
  <path d="M32 10c-9.5 0-16 7-16 16.5 0 6.2 3.5 11 7 13.5v3c0 .8.6 1.5 1.5 1.5h15c.8 0 1.5-.7 1.5-1.5v-3c3.5-2.5 7-7.3 7-13.5C48 17 41.5 10 32 10z" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbits (Eye Sockets) -->
  <ellipse cx="25.5" cy="24.5" rx="3.8" ry="4.5" fill="#0284c7" opacity="0.3" stroke="url(#cyan-glow)" stroke-width="1.6"/>
  <ellipse cx="38.5" cy="24.5" rx="3.8" ry="4.5" fill="#0284c7" opacity="0.3" stroke="url(#cyan-glow)" stroke-width="1.6"/>

  <!-- Nasal Aperture (Piriform) -->
  <path d="M32 28.5l-1.8 4.5h3.6z" fill="url(#cyan-glow)" opacity="0.85"/>

  <!-- Dental Arch & Maxilla -->
  <path d="M26 38.5h12" stroke="url(#cyan-glow)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="29" y1="36" x2="29" y2="41" stroke="url(#cyan-glow)" stroke-width="1.2"/>
  <line x1="32" y1="36" x2="32" y2="41" stroke="url(#cyan-glow)" stroke-width="1.2"/>
  <line x1="35" y1="36" x2="35" y2="41" stroke="url(#cyan-glow)" stroke-width="1.2"/>

  <!-- Cervical Spine Columns -->
  <rect x="29" y="47" width="6" height="2.5" rx="1" fill="url(#cyan-glow)" opacity="0.9"/>
  <rect x="28" y="51.5" width="8" height="2.5" rx="1" fill="url(#cyan-glow)" opacity="0.75"/>
  <rect x="27" y="56" width="10" height="2.5" rx="1" fill="url(#cyan-glow)" opacity="0.6"/>
</svg>
